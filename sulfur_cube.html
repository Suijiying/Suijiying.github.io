<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>硫方怪画廊 主页分类</title>
    <link rel="icon" href="favicon.ico" type="image/x-icon">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #f5f5f0;
            font-family: -apple-system, 'Segoe UI', 'Noto Sans', system-ui;
            padding: 1rem;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
        }

        .header {
            position: sticky;
            top: 0;
            background: #f5f5f0;
            padding: 1rem 0;
            z-index: 10;
        }

        .back-link {
            display: inline-block;
            margin-bottom: 0.5rem;
            color: #2a4a1a;
            text-decoration: none;
            border-bottom: 1px solid #d0d9c2;
        }

        h1 {
            font-size: 1.8rem;
            color: #2a4a1a;
        }

        .sub {
            color: #7c8b6e;
            margin-bottom: 1.5rem;
        }

        .category-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 1rem;
            margin: 2rem 0;
        }

        .cat-card {
            background: white;
            border-radius: 20px;
            padding: 1.5rem 0.5rem;
            text-align: center;
            text-decoration: none;
            border: 1px solid #eae5db;
            transition: transform 0.1s ease, border-color 0.2s;
        }

        .cat-card:hover {
            transform: translateY(-3px);
            border-color: #8bb56a;
        }

        .cat-icon {
            width: 64px;
            height: 64px;
            object-fit: contain;
            margin-bottom: 0.5rem;
        }

        .cat-name {
            font-size: 1rem;
            font-weight: 600;
            color: #2a4a1a;
        }

        .footer {
            margin-top: 2rem;
            text-align: center;
            font-size: 0.7rem;
            color: #9aa98b;
            border-top: 1px solid #ece5d9;
            padding-top: 1rem;
        }

        @media (max-width: 600px) {
            .category-grid {
                grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
                gap: 0.8rem;
            }
            .cat-card {
                padding: 1rem 0.3rem;
            }
            .cat-icon {
                width: 48px;
                height: 48px;
            }
            .cat-name {
                font-size: 0.85rem;
            }
        }
    </style>
</head>
