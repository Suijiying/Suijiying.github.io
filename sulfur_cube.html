            font-family: -apple-system, 'Segoe UI', 'Noto Sans', system-ui;
            padding: 1rem;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        .header {
            position: sticky;
            top: 0;
            background: #f5f5f0;
            padding: 1rem 0;
            z-index: 10;
        }

        .back-link {
            display: inline-block;
            margin-bottom: 0.5rem;
            color: #2a4a1a;
            text-decoration: none;
            border-bottom: 1px solid #d0d9c2;
        }

        h1 {

            color: #2a4a1a;
        }

        .stats {
            color: #7c8b6e;
            font-size: 0.8rem;
            margin-bottom: 1rem;
        }

        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
            gap: 0.75rem;
        }

        .gallery-item {
            background: white;
            border-radius: 12px;
            padding: 0.5rem;
            text-align: center;
            transition: transform 0.1s ease;
            border: 1px solid #eae5db;
        }

        .gallery-item:hover {
            transform: scale(1.02);
            border-color: #8bb56a;
        }

        .gallery-item img {
            width: 100%;
            aspect-ratio: 1 / 1;
            object-fit: contain;
            border-radius: 8px;
        }

        .gallery-item p {
            font-size: 0.6rem;
            color: #5a6b4e;
            margin-top: 0.3rem;
            word-break: break-word;
            line-height: 1.2;
        }

        .footer {
            margin-top: 2rem;
            text-align: center;
            font-size: 0.7rem;
            color: #9aa98b;
            border-top: 1px solid #ece5d9;
            padding-top: 1rem;
        }

        @media (max-width: 600px) {
            .gallery {
                grid-template-columns: repeat(auto-fill, minmax(70px, 1fr));
                gap: 0.5rem;
            }
            .gallery-item p {
                font-size: 0.5rem;
            }
        }
    </style>
</head>
