<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Minecraft: Humanoid</title>
    <link rel="stylesheet" href="./style.css">
</head>

<body>
    <!-- ===== Enter player name ===== -->
    <div style="display:flex; gap:8px; align-items:center; margin-bottom:10px; flex-wrap:wrap;">
        <input id="playerName" type="text" placeholder="Enter player name..." value="Steve" style="padding:6px 14px; border-radius:20px; border:1px solid #ccc; font-size:14px; flex:1; min-width:150px;">
        <button id="loadSkin" class="btn" style="padding:6px 20px; border:none; border-radius:24px; background:#4a7aff; color:#fff; font-weight:600; cursor:pointer;">load skin</button>
        <span id="statusMsg" style="font-size:13px; color:#888;"></span>
    </div>

    <input id="isAlex" type="checkbox"><label for="isAlex">Slim Model</label>
    <input id="oldSkin" type="checkbox"><label for="oldSkin">Old Skin Texture (before 14w03a)</label>
    <input id="size" type="checkbox"><label for="size">large</label><br>
    Pose:<select id="pose_select"></select><br>
    Texture:<input id="file" type="file" accept=".png"><div id="thumb"></div>
<img id="playerAvatar" width="48" height="48" style="image-rendering:pixelated; border-radius:4px; display:none; margin-left:8px;">
<br>
    <button id="rotate">rotate</button>
    <button id="reset">reset camera</button>
    <button id="execute">draw</button><br>
    <div id="background">
        <canvas id="myCanvas"></canvas>
    </div>
